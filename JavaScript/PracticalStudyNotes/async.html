<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
</head>
<body>
    <script>
        const genericFetchData = async (url) => {
            try {
                const response = await fetch(url) ;
                const data = await response.json() ;
                return data ;
            } catch (error) {
                return error ;                
            }
        }
        const fetchAPIData = async () => {
            try {
                const response = await genericFetchData('https://jsonplaceholder.typicode.com/todos/1') ;
                // const data = await response.json() ;
                console.log(response);
            } catch (error) {
                console.log(error);                
            }
        } ;
        fetchAPIData();
    </script>
</body>
</html>
